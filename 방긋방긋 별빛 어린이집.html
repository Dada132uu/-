<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>방긋방긋 별빛 어린이집</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#ffe8f0;--bg2:#e6f4ff;--ink:#4a3a5e;--card:#fffdf8;--pink:#ff8fb1;--red:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:linear-gradient(var(--bg1),var(--bg2));color:var(--ink);font-family:'Jua','Gowun Batang',sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{height:100vh;height:100dvh;min-height:440px;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative}
#veil{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,#1a0a24);opacity:0;transition:opacity 1.5s;z-index:4}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid #7a5cff;outline-offset:2px}
#hud{display:flex;justify-content:space-between;padding:10px 16px;font-size:1.05rem}
#stage{flex:1;overflow-y:auto;padding:6px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.pen{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.an{position:relative;width:96px;background:var(--card);border:3px solid #fff;border-radius:22px;padding:6px 4px 4px;box-shadow:0 4px 0 #e4d6ee;animation:fl 2.4s ease-in-out infinite}
.an:nth-child(2n){animation-delay:.6s}.an:nth-child(3n){animation-delay:1.1s}
@keyframes fl{50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.an{animation:none}}
.an small{display:block;font-size:.9rem}
.an.d{opacity:.55;box-shadow:none}
.an svg{width:100%;height:auto;display:block}
.bb{position:absolute;left:50%;top:-14px;transform:translateX(-50%);background:#fff;border:2px solid var(--ink);border-radius:12px;padding:0 8px;font-size:.85rem;white-space:nowrap;opacity:0;pointer-events:none;z-index:2}
.bb.on{opacity:1}.bb.bad{background:#2a1233;color:#ff6b6b;border-color:#ff6b6b}
.star{position:absolute;top:2px;right:6px;font-size:1.4rem;color:#ffbf00}
.spot{width:100px;height:90px;border-radius:20px;border:3px dashed #9a86b8;background:#fff8}
.hn{margin:0;text-align:center}
#say{background:var(--card);border-top:3px solid #fff;border-radius:22px 22px 0 0;padding:12px 16px 16px;min-height:150px;box-shadow:0 -4px 0 #e4d6ee;position:relative;z-index:1}
#who{color:var(--pink);font-size:1.1rem;min-height:1.5em}
#tx{font-size:1.1rem;line-height:1.5;min-height:3em}
#btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.b{background:var(--pink);color:#fff;border:0;border-radius:14px;padding:10px 20px;box-shadow:0 3px 0 #d76a90}
.b.s{background:none;color:var(--ink);box-shadow:none;border:2px solid #cbbbe0;padding:6px 12px;font-size:.9rem}
.board{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:12px;width:100%}
.board h2{margin:0 0 6px;text-align:center}
.board p{margin:4px 0;display:flex;justify-content:space-between}
.stamp{color:var(--red);border:2px solid var(--red);border-radius:6px;padding:0 6px;transform:rotate(-6deg);font-size:.85rem}
.panel{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:16px;text-align:center;width:100%}
#start{position:absolute;inset:0;z-index:6;background:linear-gradient(var(--bg1),var(--bg2));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
#start.hide{display:none}
#start h1{font-size:2.2rem;line-height:1.2;margin:0}
input{font:inherit;padding:10px 14px;border-radius:14px;border:3px solid #cbbbe0;text-align:center;color:var(--ink)}
.fade{animation:fi .6s}
@keyframes fi{from{opacity:0}}
:root{--sh:#e4d6ee}
body{transition:none}
.an{border-color:var(--card)!important;box-shadow:0 4px 0 var(--sh)!important;background:var(--card)!important}
.an.d{box-shadow:none!important}
#say{border-top-color:var(--card)!important;box-shadow:0 -4px 0 var(--sh)!important}
.board,.panel{background:var(--card)!important;border-color:var(--ink)!important}
.spot{background:var(--card)!important;border-color:var(--ink)!important;color:var(--ink)}
.b{background:var(--pink)!important;box-shadow:0 3px 0 var(--sh)!important}
.b.s{background:none!important;box-shadow:none!important}
#gl{display:flex;justify-content:center;gap:10px;padding:2px 0 0}
#gl i{width:22px;height:26px;clip-path:polygon(0 0,100% 0,50% 100%);display:block;transform-origin:top center;animation:sw 3s ease-in-out infinite;transition:all 1s}
#gl i.x{background:#777!important;opacity:.35;transform:rotate(28deg) translateY(4px);animation:none}
@keyframes sw{50%{transform:rotate(6deg)}}
@media (prefers-reduced-motion:reduce){#gl i{animation:none}}
#tc{position:absolute;inset:0;z-index:7;background:#07050c;color:#e8dff5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;opacity:0;pointer-events:none;transition:opacity .6s}
#tc.on{opacity:1;pointer-events:auto}
</style>
</head>
<body>
<div id="app">
  <div id="hud"><span id="pt">별빛 어린이집</span><span id="ct"></span><span id="st"></span></div>
  <div id="gl"></div><div id="stage"></div>
  <div id="say"><div id="who"></div><div id="tx"></div><div id="btns"></div></div>
  <div id="veil"></div><div id="tc"></div>
  <div id="start"><div id="tm"></div><h1>방긋방긋<br>별빛 어린이집</h1><p>오늘은 선생님이 처음 출근하는 날이에요!</p><input id="nm" maxlength="6" placeholder="선생님 이름" aria-label="선생님 이름"><button class="b" id="go">출근하기</button><button class="b s" id="fb">진상 파일</button><small style="opacity:.6">소리 없이 즐기는 이야기예요</small></div>
</div>
<script>
const $=id=>document.getElementById(id);
const AN={cow:'몽이',pig:'꿀꿀이',hen:'삐삐',sheep:'뭉게',duck:'꽥이',rab:'쫑이'},OR=Object.keys(AN);
let pn='선생님',per=0,gone,saved,found,stars,noCnt,mood,tm=[];
const alive=()=>OR.filter(k=>!gone.has(k));
const shuf=a=>a.slice().sort(()=>Math.random()-.5);
/* ---------- 그림 ---------- */
const E=(x,t)=>'<circle cx="'+x+'" cy="54" r="4.5" fill="#3b2f4a"/><circle cx="'+(x+1.6)+'" cy="52.4" r="1.6" fill="#fff"/>'+(t?'<path d="M'+(x+3)+' 60q4 7 0 10q-4-3 0-10z" fill="#7cc8ff"/>':'');
const M='<path d="M42 70q8 7 16 0" stroke="#3b2f4a" stroke-width="3" fill="none" stroke-linecap="round"/>';
function ani(k,t){let b='';
  if(k==='cow')b='<path d="M30 28l-6-14 14 6zM70 28l6-14-14 6z" fill="#f6e3b8"/><ellipse cx="22" cy="48" rx="9" ry="6" fill="#ffd1dc"/><ellipse cx="78" cy="48" rx="9" ry="6" fill="#ffd1dc"/><circle cx="50" cy="55" r="32" fill="#fff" stroke="#e6dbe8" stroke-width="2"/><ellipse cx="68" cy="38" rx="11" ry="9" fill="#3b2f4a" opacity=".8"/><ellipse cx="50" cy="72" rx="16" ry="10" fill="#ffc0cb"/>'+E(38,t)+E(62,t)+M;
  else if(k==='pig')b='<path d="M24 34l4-16 14 10zM76 34l-4-16-14 10z" fill="#ff9fb5"/><circle cx="50" cy="55" r="32" fill="#ffb6c8"/><ellipse cx="50" cy="68" rx="13" ry="9" fill="#ff8fab"/><circle cx="45" cy="68" r="2" fill="#b84a6b"/><circle cx="55" cy="68" r="2" fill="#b84a6b"/>'+E(36,t)+E(64,t);
  else if(k==='hen')b='<circle cx="42" cy="22" r="7" fill="#e74c3c"/><circle cx="52" cy="18" r="8" fill="#e74c3c"/><circle cx="62" cy="22" r="7" fill="#e74c3c"/><circle cx="50" cy="55" r="32" fill="#fffdf5" stroke="#f1e7c9" stroke-width="2"/><path d="M43 62l7 10l7-10z" fill="#ffa94d"/>'+E(36,t)+E(64,t);
  else if(k==='sheep')b='<g fill="#f4f1ff" stroke="#ddd5f2" stroke-width="2"><circle cx="30" cy="38" r="16"/><circle cx="50" cy="28" r="16"/><circle cx="70" cy="38" r="16"/><circle cx="24" cy="62" r="15"/><circle cx="76" cy="62" r="15"/><circle cx="34" cy="80" r="14"/><circle cx="66" cy="80" r="14"/></g><ellipse cx="50" cy="58" rx="22" ry="25" fill="#ecd9c6"/>'+E(41,t)+E(59,t)+M;
  else if(k==='duck')b='<path d="M44 24q6-10 12 0" stroke="#e6b800" stroke-width="4" fill="none"/><circle cx="50" cy="55" r="32" fill="#ffe066"/><ellipse cx="50" cy="70" rx="17" ry="8" fill="#ffa94d"/>'+E(36,t)+E(64,t);
  else b='<ellipse cx="36" cy="22" rx="8" ry="24" fill="#fff" stroke="#e6dbe8" stroke-width="2"/><ellipse cx="64" cy="22" rx="8" ry="24" fill="#fff" stroke="#e6dbe8" stroke-width="2"/><ellipse cx="36" cy="24" rx="3.5" ry="16" fill="#ffc0cb"/><ellipse cx="64" cy="24" rx="3.5" ry="16" fill="#ffc0cb"/><circle cx="50" cy="58" r="30" fill="#fff" stroke="#e6dbe8" stroke-width="2"/><circle cx="50" cy="64" r="3" fill="#ff8fab"/>'+E(39,t)+E(61,t)+M;
  return '<svg viewBox="0 0 100 100" aria-hidden="true">'+b+'</svg>'}
function ceo(w){return '<svg viewBox="0 0 120 130" width="130" aria-hidden="true"><ellipse cx="60" cy="104" rx="46" ry="30" fill="#fff5e6"/><path d="M40 96q6-10 14-4q4 10-2 18q-12 2-12-14zM72 104q8-6 12 4q-2 10-12 6z" fill="#b5483f" opacity=".85"/><circle cx="60" cy="52" r="36" fill="#ffd9c2"/><rect x="22" y="'+(w?48:40)+'" width="76" height="20" rx="10" fill="#ffb347"/><path d="'+(w?'M34 76q26 32 52 0':'M42 78q18 14 36 0')+'" fill="'+(w?'#fff':'none')+'" stroke="#8a3b3b" stroke-width="3" stroke-linecap="round"/></svg>'}
function goat(){return '<svg viewBox="0 0 100 110" width="150" aria-hidden="true"><path d="M30 34q-16-6-14-26q12 6 22 16zM70 34q16-6 14-26q-12 6-22 16z" fill="#b08968" stroke="#8a6a4f" stroke-width="2"/><ellipse cx="20" cy="50" rx="10" ry="5" fill="#f3ead9" transform="rotate(20 20 50)"/><ellipse cx="80" cy="50" rx="10" ry="5" fill="#f3ead9" transform="rotate(-20 80 50)"/><ellipse cx="50" cy="55" rx="28" ry="32" fill="#f3ead9" stroke="#e0d3bb" stroke-width="2"/><ellipse cx="39" cy="52" rx="6" ry="3" fill="#3b2f4a"/><ellipse cx="61" cy="52" rx="6" ry="3" fill="#3b2f4a"/><path d="M42 72q8 6 16 0" stroke="#3b2f4a" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M46 82q4 14 8 0z" fill="#f3ead9" stroke="#e0d3bb"/><circle cx="50" cy="100" r="7" fill="#f2c94c" stroke="#c99a1d" stroke-width="2"/></svg>'}
/* ---------- 말하기 ---------- */
function say(w,t,btns){$('who').textContent=w;$('tx').textContent=t.replace(/\{n\}/g,pn);$('btns').innerHTML='';
  (btns||[]).forEach(([l,f,c])=>{const b=document.createElement('button');b.className='b '+(c||'');b.textContent=l;b.onclick=()=>{$('btns').innerHTML='';f()};$('btns').appendChild(b)})}
function lines(a,cb,i=0){if(i>=a.length)return cb();say(a[i][0],a[i][1],[['계속',()=>lines(a,cb,i+1)]])}
/* ---------- 하루의 흐름: 시간이 갈수록 어두워짐 ---------- */
const TH=[
 {a:'#ffe8f0',b:'#e6f4ff',ink:'#4a3a5e',card:'#fffdf8',sh:'#e4d6ee',pk:'#ff8fb1',time:'오전 9시'},
 {a:'#fff6d0',b:'#d9f0ff',ink:'#4a3a5e',card:'#fffdf8',sh:'#ecdcb0',pk:'#ff9a76',time:'오전 11시'},
 {a:'#ffe0bd',b:'#f4d3c7',ink:'#4a3550',card:'#fff6ec',sh:'#e8c2a6',pk:'#e8805f',time:'오후 2시'},
 {a:'#d98a7a',b:'#6f5486',ink:'#2f2140',card:'#f1e2dc',sh:'#a4707a',pk:'#b9506a',time:'오후 5시'},
 {a:'#3d3160',b:'#18132b',ink:'#e8dff5',card:'#2b2140',sh:'#120d20',pk:'#d9648c',time:'밤 9시'},
 {a:'#24121f',b:'#08060d',ink:'#e8dff5',card:'#1c1429',sh:'#050309',pk:'#a83a5c',time:'??:??'}];
function theme(i){const t=TH[Math.min(i,5)],r=document.documentElement.style;
  r.setProperty('--bg1',t.a);r.setProperty('--bg2',t.b);r.setProperty('--ink',t.ink);r.setProperty('--card',t.card);r.setProperty('--sh',t.sh);r.setProperty('--pink',t.pk);$('veil').style.opacity=Math.min(.4,i*.07)}
function tcard(l,s,i,cb){const c=$('tc');c.innerHTML='<div style="font-size:2.4rem">'+l+'</div><small>'+s+'</small>';c.classList.add('on');
  setTimeout(()=>{theme(i);hud()},700);setTimeout(()=>c.classList.remove('on'),1900);setTimeout(cb,2500)}
const FC={cow:'#ffffff',pig:'#ffb6c8',hen:'#ffe38a',sheep:'#c9b8ff',duck:'#ffd24d',rab:'#b9e6ff'};
function hud(){$('ct').textContent=alive().length+'명 남았어요';$('st').textContent='★ '+stars;
  $('gl').innerHTML=OR.map((k,i)=>'<i class="'+(gone.has(k)?'x':'')+'" style="background:'+FC[k]+';animation-delay:'+(i*.3)+'s"></i>').join('')}
/* ---------- 대사 ---------- */
const L={cow:[['네에에! 저 여기요, 여기! 손 번쩍!','선생님 처음이세요? 저는 몽이예요!'],['냠냠! 선생님도 하나 드실래요?','저는 우유 말고 주스가 좋아요!'],['와, 별이다! 저 몇 개 받았어요?','별 몇 개 모으면 졸업해요? 저 빨리 졸업하고 싶어요!']],
 pig:[['네! 오늘 간식 뭐예요?','꿀꿀! 아침 먹었는데 또 배고파요.'],['꿀꺽! 더 주세요, 더요!','배가 빵빵해요. 조금만 더 먹으면 안 돼요?']],
 hen:[['삐약~ 삐삐예요! 인사 노래 불러도 돼요?','선생님 목소리 예뻐요. 삐약!'],['삐약~ 맛있다! 노래가 절로 나와요.','삐삐는 곡식이 제일 좋아요.'],['삐약! 별 스티커 반짝반짝~','근데 별 많이 받은 오빠들은 다 어디 갔어요?']],
 sheep:[['…네… 뭉게 여기 있어요… 아직 졸려요…','음냐… 저요… 여기요…'],['음냐… 먹다가 잘 것 같아요…','포근한 맛이에요… 졸려요…'],['…별이 따뜻해요…','선생님… 별 받으면 졸업하는 거 맞죠? 졸업하면… 어디 가요?']],
 duck:[['꽥! 놀랐죠? 헤헤.','선생님, 이름 틀리면 안 돼요! 꽥이예요, 꽥이!'],['꽥! 이거 내가 먼저 먹을래!','히히, 누가 더 빨리 먹나 내기해요!'],['꽥! 저는 큰 별로 주세요!','선생님, 졸업한 친구들은 편지도 안 보내요. 이상하죠?']],
 rab:[['네. …선생님, 복도 끝 문은 열지 말아 주세요. 부탁이에요.','선생님은 방울 소리 잘 들리세요? …아니에요, 아무것도.']]};
const HL={hen:'…선생님, 삐삐는 졸업 노래 부르기 싫어요. 여기서 조용히 있을게요.',sheep:'여기 있으면 안 들킬 줄 알았는데… 선생님, 저 아직 졸업하기 싫어요.',duck:'꽥… 들켰다. 선생님, 비밀로 해 주면 안 돼요? 부탁이에요.'};
const N={hen:['삐약… 선생님, 불 끄지 마세요.','…졸업식 노래는 안 부를래요.'],sheep:['…안 자고 있을게요. 눈 감으면 안 될 것 같아서요.','음냐…가 아니라… 무서워요, 선생님.'],duck:['꽥… 선생님, 문 쪽에서 소리가 나요.','…살려주세요, 선생님. 우리 좀 살려주세요.']};
const pick=a=>a[Math.random()*a.length|0];
/* ---------- 진행 ---------- */
const P=[
 {n:'점호',g:'roll',i:['{n} 선생님, 어서 오세요! 오늘이 첫 출근이죠? 별빛 어린이집은 방긋방긋 웃는 게 규칙이에요.','먼저 아침 점호부터 할까요? 친구들 이름을 한 명씩 불러 주세요.'],a:'어머, 목소리가 참 다정하네요. 우리 친구들 여섯 명, 모두 건강해서 다행이에요. 졸업할 때까지 건강해야 하거든요.',o:'그리고 쫑이는 몸이 일찍 커서 오늘부로 졸업이에요. 다 같이 박수~!',v:['rab']},
 {n:'간식',g:'snack',i:['아침 먹은 지 얼마 안 됐지만, 간식은 많이 먹을수록 좋아요. (어디선가 방울 소리가 딸랑.)','선생님이 한 명씩 골고루 먹여 주세요. 살이 올라야 하니까요.'],a:'꿀꿀이는 정말 잘 먹었어요. 살이 통통하게 올랐네요. 딱 먹기… 아니, 보기 좋아요, 호호.',o:'꿀꿀이도 오늘 졸업이에요. 미끄럼틀 쪽으로 데려갈게요.',v:['pig']},
 {n:'별 스티커',g:'stamp',i:['오후에는 별 스티커를 붙여요. 별은 몸무게 등급이에요. 큰 별일수록 좋은 등급이죠.','별을 많이 받은 친구는 일찍 졸업한답니다. 영광이죠?'],a:'다들 상등급이에요. 이 정도면 좋은 값에 보낼 수 있겠네요. 어머, 벌써 해가 기울기 시작했어요.',o:'몽이도 이제 졸업이에요. 별을 제일 많이 받았거든요.',v:['cow']},
 {n:'숨바꼭질',g:'hide',i:['저녁에는 숨바꼭질을 해요. 졸업 전에 한 번 뛰게 하는 거예요. 운동한 아이가 더 쫄깃하거든요. (딸랑.)','숨은 친구를 찾아 주면, 원장님이 도축… 아니, 졸업식장으로 데려갈게요.'],a:'고마워요, 선생님. 정말 훌륭한 선생님이에요. 방울 소리가 참 잘 어울려요.',o:'',v:'found'},
 {n:'낮잠',g:'nap',i:['벌써 밤이에요. 불을 끄고 재울 시간이에요.','자는 동안 졸업 준비를 해 둘게요. 칼을 갈아야 하거든요. …아니, 가위요. 이름표 자르는 가위.'],a:'쉿. 푹 잤네요. 이제 마지막 졸업식이에요.',o:'',v:[]}];
function start(){gone=new Set();saved=new Set();found=new Set();stars=0;noCnt=0;per=0;$('stage').innerHTML='';hud();tcard(TH[0].time,'별빛 어린이집의 첫날',0,runP)}
function runP(){const p=P[per];$('pt').textContent=TH[per].time+' · '+p.n;hud();lines(p.i.map(t=>['원장님',t]),()=>game(p))}
function after(p){lines([['원장님',p.a]],()=>{const v=p.v==='found'?[...found]:p.v;v.forEach(k=>gone.add(k));stars++;hud();board(p,v)})}
function game(p){const m=$('stage');m.innerHTML='';
  if(p.g==='hide'){const al=shuf(alive());let n=0,bz=0;
    m.innerHTML='<p class="hn">숨은 친구를 찾아요! 세 곳을 눌러 보세요.</p><div class="pen">'+['덤불','미끄럼틀 뒤','상자'].map((s,i)=>'<button class="spot" data-i="'+i+'">'+s+'</button>').join('')+'</div>';
    m.querySelectorAll('.spot').forEach(b=>b.onclick=()=>{const k=al[b.dataset.i];if(!k||b.disabled||bz)return;bz=1;b.disabled=true;b.innerHTML='<div style="width:70px;margin:auto">'+ani(k,1)+'</div>'+AN[k];
      const fin=()=>{bz=0;if(++n>=al.length)after(p);else say('','다음 장소를 찾아 보세요.')};
      say(AN[k],HL[k],[['찾았다!',()=>{found.add(k);say('원장님','어머, 잘 찾았어요, 선생님!',[['계속',fin]])}],['비밀이야',()=>{saved.add(k);say(AN[k],'…고마워요, 선생님.',[['계속',fin]])},'s']])});return}
  const al=alive();
  if(!al.length){m.innerHTML='<div class="panel">아무도 없는 낮잠방.<br>이불만 가지런히 개어 있다.</div>';say('','…',[['이불 덮기',()=>after(p)]]);return}
  m.innerHTML='<div class="pen">'+al.map(k=>'<button class="an" data-k="'+k+'">'+ani(k,per>=3)+'<small>'+AN[k]+'</small></button>').join('')+'</div>';
  say('','친구를 한 명씩 눌러 보세요.');let n=0;
  m.querySelectorAll('.an').forEach(b=>b.onclick=()=>{if(b.classList.contains('d'))return;b.classList.add('d');n++;const k=b.dataset.k,
    ln=p.g==='nap'?pick(N[k]):pick(L[k][per]);
    if(p.g==='stamp')b.insertAdjacentHTML('beforeend','<span class="star">★</span>');
    say(AN[k],ln,n>=al.length?[['계속',()=>after(p)]]:[])})}
function board(p,v){const m=$('stage');$('pt').textContent=TH[per].time+' · 알림장';
  m.innerHTML='<div class="board"><h2 id="bt">알림장</h2>'+OR.map(k=>'<p><span>'+AN[k]+'</span>'+(gone.has(k)?'<span class="stamp">졸업했어요!'+(per>=2?' · 상':'')+'</span>':'<span>'+(saved.has(k)?'(숨어 있음)':'')+'</span>')+'</p>').join('')+'</div>';
  if(per>=3){const t=$('bt');setTimeout(()=>{t.textContent='출하 예정표';setTimeout(()=>t.textContent='알림장',300+per*200)},1000)}
  hud();
  const o=per===3?(v.length?'찾아 준 친구들은 원장님이 데려갈게요. 걱정 마세요, 아주 좋은 곳이에요.':'어머, 아무도 못 찾았네요? 그럼 낮잠 시간에 원장님이 다시 찾아볼게요.'):p.o;
  const dec=()=>{const btns=[['네!',()=>{stars++;nextP()}]];
    if(per>=2)btns.push(['아니에요',()=>{noCnt++;const R=['어머, 피곤하세요? 괜찮아요. 쉬엄쉬엄 해요.','선생님도 참… 처음엔 다들 그래요. 곧 익숙해져요.','…그건 곤란한데. 선생님은 착하니까 할 수 있어요.'];say('원장님',R[per-2],[['계속',nextP]])},'s']);
    say('원장님',per>=4?'이제 마지막 졸업식이에요. 준비됐죠, 선생님?':per>=2?'다음 시간에도 손 잡고 같이 가 줄 거죠, 선생님?':'다음 시간에도 같이 해 줄 거죠, 선생님?',btns)};
  if(o)say('원장님',o,[['계속',dec]]);else dec()}
function nextP(){per++;if(per>=5)final();else tcard(TH[per].time,P[per].n+' 시간',per,runP)}
function final(){tcard(TH[5].time,'졸업식',5,()=>{$('pt').textContent='졸업식';$('stage').innerHTML='<div style="text-align:center">'+ceo(noCnt>0)+'</div>';
  lines([['원장님','오늘은 선생님이 졸업하는 날이에요. 그동안 정말 고마웠어요.'],['','원장님이 복도 끝의 문을 열었다. 문 위에 간판이 걸려 있다.']],()=>{
    $('stage').innerHTML='<div class="panel fade" style="border-width:5px"><div style="font-size:2.6rem;letter-spacing:6px">도축장</div><small>별빛 농장 출하동</small></div>';
    lines([['원장님','어머, 놀랐어요? 숨길 생각은 없었어요. 여기는 별빛 농장이에요. 어린이집은 친구들이 마음 편히 크라고 붙인 이름이고요.'],['원장님','졸업은 출하, 별 스티커는 등급, 알림장은 출하 예정표. 점호는 두수 확인이었죠. 선생님도 알고 있었잖아요?'],['원장님','살이 오른 아이들은 정말 맛있어요. 우리 친구들은 모두 누군가의 식탁에 올라가요. 아주 좋은 일이죠.'],['','원장님이 거울을 가리킨다.']],()=>{
      $('stage').innerHTML='<div class="panel fade"><b>거울 속의 선생님</b><br>'+goat()+'</div>';
      lines([['','거울 속의 선생님은 뿔이 달린 염소였다. 목에서 방울이 딸랑거린다.'],['원장님','선생님은 유도 염소예요. 염소는 겁이 없어서, 양도 돼지도 닭도 선생님을 믿고 줄줄 따라 들어가요.'],['원장님','선생님이 방울을 딸랑이며 앞장서면 친구들은 무서워하지 않아요. 그래서 선생님은 끝까지 안 먹어요. 우리 농장의 보물이거든요.'],['원장님','선생님도 아기 때 이 농장에 왔어요. 이름은 처음부터 「선생님」이었죠. 그렇게 부르면 다들 자기가 사람인 줄 알더라고요. 호호.']],choice)})})})}
function choice(){const b=[['손 잡고 간다',()=>end(noCnt===0?2:1)],['현관 문고리를 돌린다',()=>{if(saved.size>=1)end(3);else say('','현관 문고리가 돌아가지 않는다. 방울 소리만 딸랑.',[['…',()=>end(1)]])},'s']];
  if(saved.size>=2&&noCnt>=2)b.push(['노래를 바꿔 부른다',()=>end(4),'s']);
  say('원장님','자, 졸업식 노래를 불러요! 선생님이 앞장서 줄 거죠?',b)}
const EN={1:['졸업','방울 소리가 문 안쪽으로 사라졌다. 선생님은 마지막 친구들을 문 앞까지 데려다 주었다. 어린이집은 오늘도 방긋방긋 웃는다.'],
 2:['영원한 선생님','다음 날, 새 친구들이 들어왔다. 선생님은 방울을 딸랑이며 인사한다. 「오늘도 방긋방긋!」 아무도 선생님의 뿔을 이상하게 여기지 않는다.'],
 3:['문밖의 들판','현관 문고리가 돌아갔다. 문 밖은 햇빛 가득한 들판이었다. 숨겨 둔 친구들이 달려 나왔다. 뒤에서 원장님의 노랫소리가 점점 멀어진다.'],
 4:['살려주세요','마지막 노래의 가사를 바꿔 모두 함께 불렀다. 「살려주세요, 살려주세요」 그 한마디에 원장님의 웃음이 처음으로 멈췄다. 방울이 툭, 떨어졌다. 선생님은 이제 염소가 아니다.']};
const EPI={
 1:['문 안쪽은 하얀 타일이 깔린 긴 복도였다. 벽에는 귀표가 줄지어 걸려 있다. 친구들의 이름, 그리고 맨 끝에 선생님의 이름표.','「선생님 건 아직 못 써요. 마지막까지 아껴 둘게요.」 원장님이 웃으며 문을 닫았다.','다음 날 아침, 트럭에서 새 친구들이 내렸다. 선생님은 방울을 울리며 앞장선다. 소리가 어제보다 조금 무겁다.'],
 2:['세월이 흘렀다. 선생님은 이제 방울이 무거운 줄도 모른다. 새 친구들은 선생님을 보면 안심한 얼굴로 줄을 선다.','가끔 어린이집 구석에서 낡은 방울이 발견된다. 전임 선생님의 것이다. 선생님은 그것을 서랍에 넣고 서랍을 닫는다.','「오늘도 방긋방긋!」 선생님은 웃는다. 이 웃음이 누구의 것인지, 이제 선생님도 모른다.'],
 3:['들판 끝에는 철조망이 있었다. 철조망 너머에 똑같이 생긴 건물이 줄지어 서 있다. 지붕마다 간판이 달려 있다. 「별빛 어린이집 2호」, 「3호」, 「4호」.','같은 앞치마를 입은 사람들이 멀리서 이쪽을 보고 손을 흔든다. 원장님은 한 명이 아니었다.','선생님은 방울을 풀어 풀숲에 놓고 왔다. 소리가 나지 않자, 처음으로 아무도 따라오지 않았다. 친구들은 선생님 곁에서 나란히 걸었다.'],
 4:['노래가 멈추자 농장 곳곳에서 대답이 들려왔다. 「살려주세요.」 다른 건물에서, 다른 우리에서, 수십 개의 목소리가.','원장님은 주저앉았다. 「…나는 그냥, 아이들이 크는 걸 보고 싶었을 뿐인데.」 그 말도 거짓은 아니었다.','문이 열렸다. 선생님은 방울을 떼어 원장님의 손에 쥐여 주고, 친구들과 함께 걸어 나갔다. 아무도 선생님을 염소라고 부르지 않았다.']};
const FI={
 1:['별빛 농장 안내문','별빛 어린이집은 별빛 농장의 대외 명칭입니다. 졸업은 출하, 별 스티커는 체중 등급, 알림장은 출하 예정표, 점호는 두수 확인을 뜻합니다. 방울을 단 유도 동물이 이동 동선을 안내합니다.'],
 2:['전임 선생님의 기록','전임 유도 염소 「딸랑이」. 생후 2개월에 입사. 스스로를 어린이집 교사라고 믿고 3년을 근무했다. 3년째 되던 해, 방울이 너무 무겁다며 현관 문을 열려고 했다. 기록은 거기서 끝난다. 방울은 다음 염소에게 물려졌다.'],
 3:['들판 너머','별빛 농장은 전국에 열두 곳. 간판은 모두 같다. 원장은 지점마다 한 명 이상이며 매달 목장 회의를 연다. 회의록에는 유도 염소의 교체 주기가 적혀 있다. 평균 근속 3년.'],
 4:['원장님의 일기','첫해: 「졸업하는 날은 마음이 아프다. 그래도 누군가의 식탁에서 웃음이 된다고 생각하면 위로가 된다.」 3년째: 「졸업 노래가 조금씩 짧아졌다.」 마지막 장: 「오늘 처음으로 노래 가사가 틀렸다. 누가 바꿨는지는 모르겠지만, 이상하게 속이 시원했다.」']};
let mem=[];
function seen(){try{return JSON.parse(localStorage.getItem('slk_f')||'[]')}catch(_){return mem}}
function mark(k){const s=seen().slice();if(!s.includes(k))s.push(k);mem=s;try{localStorage.setItem('slk_f',JSON.stringify(s))}catch(_){}return s}
function fileList(back){const s=seen();$('start').classList.add('hide');theme(4);
  $('stage').innerHTML='<div class="panel fade" style="text-align:left"><h2 style="margin:0 0 8px;text-align:center">진상 파일 '+s.length+'/4</h2>'+[1,2,3,4].map(k=>s.includes(k)?'<p><b>'+FI[k][0]+'</b><br><small>'+FI[k][1]+'</small></p>':'<p style="opacity:.5">??? <small>(엔딩 '+k+'번을 보면 열려요)</small></p>').join('')+'</div>';
  say('','',[['돌아가기',back]])}
function home(){theme(0);$('stage').innerHTML='';$('start').classList.remove('hide');$('fb').textContent='진상 파일 '+seen().length+'/4';say('','',[])}
function end(k){theme(k===3||k===4?0:5);$('stage').innerHTML='<div class="panel fade"><h2 style="margin:0">'+EN[k][0]+'</h2><p>'+EN[k][1]+'</p><p style="opacity:.7;font-size:.9rem">구한 친구 '+saved.size+'명 · 거절 '+noCnt+'번</p></div>';
  say('','',[['그 이후',()=>lines(EPI[k].map(t=>['',t]),()=>unlock(k))]])}
function unlock(k){const s=mark(k);theme(k===3||k===4?0:4);
  $('stage').innerHTML='<div class="panel fade" style="text-align:left"><small>진상 파일 '+s.length+'/4 해금</small><h2 style="margin:4px 0">'+FI[k][0]+'</h2><p>'+FI[k][1]+'</p></div>';
  say('','다른 결말에서 더 많은 기록을 찾을 수 있어요.',[['기록 모아보기',()=>fileList(()=>unlock(k))],['처음부터',home,'s']])}
$('tm').innerHTML=ceo(false);
$('fb').textContent='진상 파일 '+seen().length+'/4';
$('fb').onclick=()=>fileList(home);
$('go').onclick=()=>{pn=$('nm').value.trim()||'하늘';$('start').classList.add('hide');start()};
</script>
